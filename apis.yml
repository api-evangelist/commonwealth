aid: commonwealth
name: Commonwealth
description: >-
  Commonwealth — now operating as Common (common.xyz) — is an onchain community
  platform for decentralized governance, discussion, and coordination. It gives
  crypto communities, DAOs, and token projects a single home for forums and
  threaded discussion, on-chain and off-chain proposals and polls, Snapshot
  governance, treasury and token tooling, a Launchpad for community coins, and
  reputation/trust levels. Members authenticate with web3 wallets or social
  login (Magic), and communities can run custom domains, contests, referrals,
  and integrations. Common positions itself as enabling "AI coordination for
  communities, contributors, and agents," and exposes a documented webhook
  surface (Discord, Telegram, Slack, Zapier) plus a permissioned developer API
  for building new front-ends against community content and the permissionless
  Common Protocol smart contracts. Commonwealth is a portfolio company of Canaan
  Partners.
